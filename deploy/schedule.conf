# 日程清单（React 前端 + Node 后端，前后端分离）
#
# 拓扑：
#   浏览器 ──/schedule/────────►  nginx ──alias──► /data/schedule-web/     （发布产物）
#          └─/schedule/api/* ──►  nginx ──proxy──► 127.0.0.1:25692        （Node 后端）
#
# 前端用相对路径 `./api/…` 发请求（见 app/src/data/api.ts），所以在
# https://…/schedule/ 下天然解析成 /schedule/api/… —— 前后端同源，
# 后端一行 CORS 都不用写。这是刻意选的，改前端请求路径前先想清楚这点。
#
# 挂载（2026-10-15 改）：工程目录**不再挂进容器**，只挂两个运行时目录：
#   ~/.local/schedule/web → /data/schedule-web:ro   前端发布产物
#   ~/.local/schedule/app → /data/schedule-app:ro   后端代码（只读，线上用不到，
#                                                         挂着是为了排障时能核对版本）
# 以前挂的是 `/home/xiaokubao/family/星星包/coding/日程管理 → /data/schedule`（SMB），
# 于是「本地 build 覆盖 SMB 那份 dist/」就等于上线 —— 构建产物落在多设备共享的源码
# 目录里，没有发布动作、没有备份、没有回滚。**别改回去**，发布走 deploy/publish-web.sh。
#
# ⚠️ 这里是 `npm run build`（Vite）的产物，不是手写的 10 个文件了。
#    文件名带内容哈希，所以 assets/ 可以长缓存；index.html 必须 no-cache。

# ---- 补斜杠 ----
# 少了尾斜杠时，相对路径会解析到 /api/… 而不是 /schedule/api/…，接口全 404。
# 必须显式跳转；nginx 不会自动补。
location = /schedule { return 301 /schedule/; }

# ---- 后端 API ----
# 必须比下面的 `location ^~ /schedule/` 更长才能抢到 —— nginx 在多个 `^~`
# 前缀块里选最长的那个，所以这两块的先后顺序无所谓，但两块都得是 `^~`。
# proxy_pass 带了 URI 部分（/api/），匹配到的前缀会被替换掉：
#   /schedule/api/tasks  →  /api/tasks
location ^~ /schedule/api/ {
    proxy_pass http://127.0.0.1:25692/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;              # 后端限速要按真实来源
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 5m;                              # 导入备份走这里
    # 接口一律不缓存：带 Authorization 的响应被中间层存下来就是事故
    add_header Cache-Control "no-store" always;
}

# ---- AI 对话：SSE 流式 ----
# 为什么单独一块：上面那块的两个默认值会**把流掐死** ——
#   proxy_read_timeout 30s  —— **实测过**：上游静默超过 30 秒的那一轮直接 504
#                              （带工具调用的问答很常见这种静默：模型在往返）。
#                              建块时量的是 30.03s 就 504、改 300s 后 35s 正常。
#   proxy_buffering 默认开  —— 这条老实说：在本机 nginx 1.29.8 上开着和关着
#                              **量不出差别**。留着是标准写法的预防（payload 变大
#                              或链路开了 gzip 时会咬人），不是本机验出来的必要项。
# 前缀更长所以这块赢；两块都是 `^~`，先后顺序无所谓（这条也实测过）。
location ^~ /schedule/api/ai/chat {
    proxy_pass http://127.0.0.1:25692/api/ai/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    # 关掉连接复用：keep-alive 会让 nginx 攒着等下一段，头几段就迟迟不出去。
    # 配合 http_version 1.1 用空值 —— 这是 nginx 官方对 SSE 的标准写法。
    proxy_set_header Connection "";
    # 这条**必须重写**，而且实测过：`add_header` 只在「同一层没写过」时才继承
    # 上一层 —— 而这两块是**同层的两个 location**，不是父子，父块那条传不过来。
    add_header Cache-Control "no-store" always;
}

# ---- 本地目录不对外提供 ----
# 2026-10-15 起源码**根本不在容器里**（工程目录已不再挂载），这几条按说是死代码。
# 留着当第二道锁：万一以后有人把 alias 改成指向别处、或把工程目录重新挂回来，
# 源码不会跟着一起裸奔。
# server/ 尤其要紧 —— 那里有 SQLite 库和 secret.key。
location ^~ /schedule/app/          { return 404 "not found"; }
location ^~ /schedule/server/       { return 404 "not found"; }
location ^~ /schedule/legacy/       { return 404 "not found"; }
location ^~ /schedule/deploy/       { return 404 "not found"; }
location ^~ /schedule/docs/         { return 404 "not found"; }
location ^~ /schedule/tools/        { return 404 "not found"; }
location ^~ /schedule/tests/        { return 404 "not found"; }
location ^~ /schedule/_refactor/    { return 404 "not found"; }
location ^~ /schedule/src/          { return 404 "not found"; }
location ^~ /schedule/node_modules/ { return 404 "not found"; }
# 顶级目录是 . 开头的项目内务（.git / .omc / .claude / .workbuddy / .mindfs），
# 一个都不该对外。用前缀块而不是正则块 —— 上面所有 `^~` 都带「^~ 命中就不再看
# 正则」的语义，写成 `location ~ ^/schedule/\.` 是**永远不会触发**的死代码。
location ^~ /schedule/.             { return 404 "not found"; }

# ---- 带哈希的静态资源 ----
# 这些文件名里有内容哈希（index-BiROn4Xw.js），内容一变文件名就变，
# 所以可以放心长缓存 —— 正是账本 assets/ 那条规则。
# 必须排在下面通用的 `^~ /schedule/` 之前吗？不用，前缀更长就赢。
location ^~ /schedule/assets/ {
    alias /data/schedule-web/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ---- App 自更新的安装包目录 ----
# APK + version.json。**放在本机磁盘，不混运行时产物与源码**
# —— SMB 读大文件不可靠（这项目在 SMB 上丢过文件）。
# 现在前端产物（schedule-web）和后端代码（schedule-app）也都在本机磁盘同一层。
#   宿主机：/home/xiaokubao/.local/schedule/apk
#   容器内：/data/schedule-apk（挂载见 ~/docker/nginx/docker-compose.yml）
# 前缀比下面的 `^~ /schedule/` 长，所以这块赢；两块都是 `^~`，先后顺序无所谓。
#
# 发布流程见 deploy/publish-apk.sh；客户端怎么用见 AppUpdate.java。
location ^~ /schedule/dl/ {
    alias /data/schedule-apk/;
    default_type application/octet-stream;
    access_log off;
    # **一律 no-store**。apk 才 4MB，不值得为它省带宽；而 version.json 是唯一
    # 告诉客户端「有没有新版」的地方，一旦被缓存住，症状就是「永远提示不了更新」
    # —— 那种 bug 极难查（服务端明明是新的）。宁可她每次多下一次。
    add_header Cache-Control "no-store" always;
    expires off;
}

# ---- 应用本体 ----
# 这里只剩 index.html / manifest.json / icon.svg / sw.js，**文件名固定、没有哈希**，
# 绝对不能长缓存 —— 否则 index.html 会把用户永久钉在旧版本上。
# sw.js 走同一条 no-cache 也是对的：浏览器每次导航都会重新校验 SW 脚本，
# 改了策略立刻生效。（新版确实注册 Service Worker，见 app/public/sw.js。）
location ^~ /schedule/ {
    alias /data/schedule-web/;
    index index.html;
    add_header Cache-Control "no-cache";
    access_log off;
}
