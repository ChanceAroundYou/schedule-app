# 日程清单（纯静态前端）
#
# 前端是**无构建**的纯静态应用：源文件即产物，由 tools/sync-dist.mjs 挑出放进 dist/。
# nginx 只挂 dist/ —— 源码 _refactor/、本地脚本 tools/、项目文档一概不对外。
# 改完代码跑 `node tools/sync-dist.mjs`，dist/ 变了刷新页面就生效。
#
# 挂载：/home/xiaokubao/family/星星包/coding/日程管理 → /data/schedule

# ---- 补斜杠 ----
# 少了尾斜杠时，相对路径会解析到 /store.js 而不是 /schedule/store.js，直接白屏。
# 必须显式跳转；nginx 不会自动补。
location = /schedule { return 301 /schedule/; }

# ---- 本地目录不对外提供 ----
# _refactor/ 是未启用的 React 重构骨架，src/ 是将来的源码，tools/ 是本地脚本，
# tests/ 是测试脚本（含本机绝对路径），deploy/ 是这份配置的副本。
# dist/ 由 sync-dist.mjs 白名单生成，本来就只有那 10 个文件；
# 这里挡的是「有人直接访问源码目录」这条路。
location ^~ /schedule/_refactor/    { return 404 "not found"; }
location ^~ /schedule/src/         { return 404 "not found"; }
location ^~ /schedule/tools/       { return 404 "not found"; }
location ^~ /schedule/tests/       { return 404 "not found"; }
location ^~ /schedule/deploy/      { return 404 "not found"; }
location ^~ /schedule/node_modules/ { return 404 "not found"; }

# ---- Service Worker ----
# 必须是 no-store：被缓存的 SW 会一直发旧版本的 app.js/styles.css，
# 改了代码用户那边永远刷不出来。SW 本身只有 1.4KB，无所谓多回源。
# 作用域刚好覆盖 /schedule/（app.js 里用的是相对路径 register('sw.js')）。
location = /schedule/sw.js {
    alias /data/schedule/dist/sw.js;
    add_header Cache-Control "no-store, must-revalidate" always;
    expires off;
}

# ---- 应用本体与静态资源 ----
# 这里的文件名是固定的（app.js / styles.css），没有内容哈希，
# 所以**不能**长缓存：必须每次回源校验，否则改了代码拿不到新版。
# 和账本的 /balancebook/assets/（带哈希、expires 1y）是两回事，别照抄那条。
location ^~ /schedule/ {
    alias /data/schedule/dist/;
    index index.html;
    add_header Cache-Control "no-cache";
    access_log off;
}
